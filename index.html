<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICDS Master Mock Test - 50 Marks</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #2980b9;
      --success: #27ae60;
      --danger: #c0392b;
      --light: #f8f9fa;
      --dark: #333;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      color: var(--dark);
      line-height: 1.5;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0 0 10px 0;
      color: var(--primary);
    }
    .meta-info {
      display: flex;
      justify-content: space-around;
      background: #eef2f5;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }
    #timer {
      color: var(--danger);
      font-size: 1.1em;
    }
    .question-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .question-title {
      font-weight: 600;
      font-size: 1.05em;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .options label {
      display: block;
      background: #f8f9fa;
      border: 1px solid #dcdcdc;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .options label:hover {
      background: #e8f4fc;
    }
    .options input[type="radio"] {
      margin-right: 10px;
    }
    .btn-submit {
      display: block;
      width: 100%;
      background: var(--secondary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 25px;
    }
    .btn-submit:hover {
      background: #1a5276;
    }
    #result-box {
      display: none;
      background: #e8f8f5;
      border: 2px solid var(--success);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 25px;
    }
    .score-summary {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }
    .stat-box {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      width: 22%;
    }
    .stat-total { background: #34495e; }
    .stat-correct { background: var(--success); }
    .stat-wrong { background: var(--danger); }
    .stat-unattempted { background: #f39c12; }
    
    /* Answer Key Display */
    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #fff8e7;
      border-left: 4px solid #f39c12;
      font-size: 0.9em;
    }
    .correct-ans {
      background: #d4edda !important;
      border-color: #c3e6cb !important;
    }
    .wrong-ans {
      background: #f8d7da !important;
      border-color: #f5c6cb !important;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>ICDS Supervisor / Worker Special Hard Mock Test</h2>
    <div class="meta-info">
      <span>মোট প্রশ্ন: ৫০</span>
      <span>মোট নম্বর: ৫০</span>
      <span id="timer">সময় বাকি: ৪৫:০০</span>
    </div>
  </div>

  <div id="result-box">
    <h3>পরীক্ষার ফলাফল (Result)</h3>
    <div class="score-summary">
      <div class="stat-box stat-total">স্কোর: <span id="res-score">0</span>/50</div>
      <div class="stat-box stat-correct">সঠিক: <span id="res-correct">0</span></div>
      <div class="stat-box stat-wrong">ভুল: <span id="res-wrong">0</span></div>
      <div class="stat-box stat-unattempted">অচেষ্টিত: <span id="res-unatt">0</span></div>
    </div>
  </div>

  <form id="quizForm">
    <div id="questions-container"></div>
    <button type="button" class="btn-submit" onclick="submitQuiz()">পরীক্ষা জমা দিন (Submit Test)</button>
  </form>
</div>

    exp: "3A/10 = B/4 = C/5 = k। A = 10k/3, B = 4k, C = 5k। A:B:C = 10/3 : 4 : 5 = 10 : 12 : 15।"
  }
];

// Load Questions into DOM
const container = document.getElementById("questions-container");

quizData.forEach((q, index) => {
  const qCard = document.createElement("div");
  qCard.className = "question-card";
  qCard.id = `q-card-${index}`;

  let optionsHTML = "";
  q.a.forEach((opt, optIdx) => {
    optionsHTML += `
      <label id="opt-label-${index}-${optIdx}">
        <input type="radio" name="q${index}" value="${optIdx}">
        ${opt}
      </label>
    `;
  });

  qCard.innerHTML = `
    <div class="question-title">${q.q}</div>
    <div class="options">${optionsHTML}</div>
    <div class="explanation" id="exp-${index}">
      <strong>ব্যাখ্যা:</strong> ${q.exp}
    </div>
  `;
  container.appendChild(qCard);
});

// Timer Logic
let totalTime = 45 * 60; // 45 Minutes
const timerDisplay = document.getElementById("timer");

const timerInterval = setInterval(() => {
  let minutes = Math.floor(totalTime / 60);
  let seconds = totalTime % 60;
  minutes = minutes < 10 ? '0' + minutes : minutes;
  seconds = seconds < 10 ? '0' + seconds : seconds;

  timerDisplay.textContent = `সময় বাকি: ${minutes}:${seconds}`;

  if (totalTime <= 0) {
    clearInterval(timerInterval);
    alert("সময় শেষ! আপনার উত্তরসমূহ জমা নেওয়া হচ্ছে।");
    submitQuiz();
  }
  totalTime--;
}, 1000);

// Submit Quiz Logic
function submitQuiz() {
  clearInterval(timerInterval);
  
  let score = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let unattemptedCount = 0;

  quizData.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const expBox = document.getElementById(`exp-${index}`);
    expBox.style.display = "block"; // Show Explanations

    if (selected) {
      const userAns = parseInt(selected.value);
      if (userAns === q.correct) {
        score++;
        correctCount++;
        document.getElementById(`opt-label-${index}-${userAns}`).classList.add("correct-ans");
      } else {
        wrongCount++;
        document.getElementById(`opt-label-${index}-${userAns}`).classList.add("wrong-ans");
        document.getElementById(`opt-label-${index}-${q.correct}`).classList.add("correct-ans");
      }
    } else {
      unattemptedCount++;
      document.getElementById(`opt-label-${index}-${q.correct}`).classList.add("correct-ans");
    }

    // Disable all inputs after submit
    const inputs = document.getElementsByName(`q${index}`);
    inputs.forEach(input => input.disabled = true);
  });

  // Display Results
  document.getElementById("res-score").textContent = score;
  document.getElementById("res-correct").textContent = correctCount;
  document.getElementById("res-wrong").textContent = wrongCount;
  document.getElementById("res-unatt").textContent = unattemptedCount;

  const resBox = document.getElementById("result-box");
  resBox.style.display = "block";
  resBox.scrollIntoView({ behavior: 'smooth' });
}
</script>
