<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICDS Special Advance Mega Mock Test - 100 Marks</title>
<style>
:root {
  --primary:#2c3e50; --secondary:#2980b9; --success:#27ae60;
  --danger:#c0392b; --warning:#f39c12; --light:#f8f9fa; --dark:#333;
}
* { box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9; margin:0; padding:12px; color:var(--dark); line-height:1.5; }
.container { max-width:900px; margin:0 auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.1); }
.header { text-align:center; border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:20px; }
.header h2 { margin:0 0 10px; color:var(--primary); }
.meta-info { display:flex; flex-wrap:wrap; justify-content:space-around; background:#eef2f5; padding:10px; border-radius:8px; font-weight:bold; gap:10px; }
#timer { color:var(--danger); font-size:1.1em; }
.neg-note { color:var(--danger); font-size:.9em; text-align:center; margin-top:5px; }
.question-card { background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:15px; margin-bottom:15px; }
.question-title { font-weight:600; font-size:1em; color:var(--primary); margin-bottom:12px; }
.options label { display:block; background:#f8f9fa; border:1px solid #dcdcdc; padding:10px 12px; margin-bottom:8px; border-radius:6px; cursor:pointer; transition:background .2s; }
.options label:hover { background:#e8f4fc; }
.options input[type="radio"] { margin-right:10px; }
.btn-submit { display:block; width:100%; background:var(--secondary); color:#fff; border:0; padding:14px; font-size:1.1em; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:25px; }
.btn-submit:hover { background:#1a5276; }
.btn-submit:disabled { background:#7f8c8d; cursor:not-allowed; }
#result-box { display:none; background:#e8f8f5; border:2px solid var(--success); padding:20px; border-radius:10px; text-align:center; margin-bottom:25px; }
.score-summary { display:flex; flex-wrap:wrap; justify-content:space-around; margin-top:15px; gap:10px; }
.stat-box { padding:10px; border-radius:6px; font-weight:bold; color:#fff; min-width:120px; flex:1; }
.stat-total { background:#34495e; } .stat-correct { background:var(--success); }
.stat-wrong { background:var(--danger); } .stat-unattempted { background:var(--warning); }
.explanation { display:none; margin-top:10px; padding:10px; background:#fff8e7; border-left:4px solid var(--warning); font-size:.9em; }
.correct-ans { background:#d4edda !important; border-color:#c3e6cb !important; }
.wrong-ans { background:#f8d7da !important; border-color:#f5c6cb !important; }
.status { display:none; margin-top:15px; padding:10px; border-radius:8px; background:#f8f9fa; font-weight:600; }
@media (max-width:600px) { body {padding:6px} .container {padding:12px} .meta-info {flex-direction:column} .stat-box {min-width:100%} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>ICDS Special Advance Mega Mock Test</h2>
    <div class="meta-info">
      <span>মোট প্রশ্ন: ১০০</span>
      <span>মোট নম্বর: ১০০</span>
      <span id="timer">সময় বাকি: ৩০:০০</span>
    </div>
    <div class="neg-note">* প্রতি ভুল উত্তরের জন্য ০.২৫ নম্বর কাটা যাবে (-০.২৫)</div>
  </div>

  <div id="result-box">
    <h3>পরীক্ষার ফলাফল (Result)</h3>
    <div class="score-summary">
      <div class="stat-box stat-total">চূড়ান্ত প্রাপ্ত নম্বর: <span id="res-score">0</span>/100</div>
      <div class="stat-box stat-correct">সঠিক: <span id="res-correct">0</span> (+<span id="res-pos">0</span>)</div>
      <div class="stat-box stat-wrong">ভুল: <span id="res-wrong">0</span> (-<span id="res-neg">0</span>)</div>
      <div class="stat-box stat-unattempted">অচেষ্টিত: <span id="res-unatt">0</span></div>
    </div>
  </div>

  <form id="quizForm">
    <div id="questions-container"></div>
    <button type="button" class="btn-submit" id="submitBtn">পরীক্ষা জমা দিন (Submit Test)</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>

    a: ["হাইপারগ্লাইসেমিয়া", "প্লাজমা অ্যালবুমিন হ্রাস (Hypoalbuminemia)", "ক্যালসিয়াম সঞ্চয় বৃদ্ধি", "ভিটামিন K-এর অভাব"],

const container = document.getElementById("questions-container");
const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

quizData.forEach((q, index) => {
  const qCard = document.createElement("div");
  qCard.className = "question-card";
  qCard.id = `q-card-${index}`;

  let optionsHTML = "";
  q.a.forEach((opt, optIdx) => {
    optionsHTML += `
      <label id="opt-label-${index}-${optIdx}">
        <input type="radio" name="q${index}" value="${optIdx}">
        ${escapeHTML(opt)}
      </label>`;
  });

  qCard.innerHTML = `
    <div class="question-title">${index + 1}. ${escapeHTML(q.q.replace(/^[০-৯\d]+\.\s*/, ""))}</div>
    <div class="options">${optionsHTML}</div>
    <div class="explanation" id="exp-${index}">
      <strong>ব্যাখ্যা:</strong> ${escapeHTML(q.exp)}
    </div>`;
  container.appendChild(qCard);
});

let totalTime = 30 * 60;
let submitted = false;
const timerDisplay = document.getElementById("timer");

const timerInterval = setInterval(() => {
  if (submitted) return;
  const minutes = String(Math.floor(totalTime / 60)).padStart(2, "0");
  const seconds = String(totalTime % 60).padStart(2, "0");
  timerDisplay.textContent = `সময় বাকি: ${minutes}:${seconds}`;

  if (totalTime <= 0) {
    clearInterval(timerInterval);
    submitQuiz(true);
    return;
  }
  totalTime--;
}, 1000);

function submitQuiz(autoSubmit = false) {
  if (submitted) return;

  if (!autoSubmit) {
    const ok = confirm("আপনি কি পরীক্ষা জমা দিতে চান? জমা দিলে উত্তর পরিবর্তন করা যাবে না।");
    if (!ok) return;
  }

  submitted = true;
  clearInterval(timerInterval);
  submitBtn.disabled = true;

  let correctCount = 0, wrongCount = 0, unattemptedCount = 0;

  quizData.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    document.getElementById(`exp-${index}`).style.display = "block";

    if (selected) {
      const userAns = Number(selected.value);
      if (userAns === q.correct) {
        correctCount++;
        document.getElementById(`opt-label-${index}-${userAns}`).classList.add("correct-ans");
      } else {
        wrongCount++;
        document.getElementById(`opt-label-${index}-${userAns}`).classList.add("wrong-ans");
        document.getElementById(`opt-label-${index}-${q.correct}`).classList.add("correct-ans");
      }
    } else {
      unattemptedCount++;
      document.getElementById(`opt-label-${index}-${q.correct}`).classList.add("correct-ans");
    }

    document.querySelectorAll(`input[name="q${index}"]`).forEach(input => input.disabled = true);
  });

  const positiveMarks = correctCount;
  const negativeMarks = wrongCount * 0.25;
  const finalScore = Math.max(0, positiveMarks - negativeMarks);

  document.getElementById("res-score").textContent = finalScore.toFixed(2);
  document.getElementById("res-pos").textContent = positiveMarks.toFixed(2);
  document.getElementById("res-neg").textContent = negativeMarks.toFixed(2);
  document.getElementById("res-correct").textContent = correctCount;
  document.getElementById("res-wrong").textContent = wrongCount;
  document.getElementById("res-unatt").textContent = unattemptedCount;

  document.getElementById("result-box").style.display = "block";
  statusBox.style.display = "block";
  statusBox.textContent = autoSubmit
    ? "৩০ মিনিট সময় শেষ হয়েছে। আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হয়েছে।"
    : "আপনার পরীক্ষা সফলভাবে জমা হয়েছে। সঠিক উত্তর ও ব্যাখ্যা দেখানো হয়েছে।";

  document.getElementById("result-box").scrollIntoView({behavior:"smooth", block:"start"});
}

submitBtn.addEventListener("click", () => submitQuiz(false));
</script>
